<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sem conexão — Mercado Ilha</title>
    <!--
      Página offline (T13 do plano de otimização). HTML estático puro, SEM JavaScript:
      el Service Worker la precachea y la sirve como fallback de navegación sin conexión.
      No depende de hidratación de Next (por eso no es una ruta de la app) para no romper
      offline. Estilos inline con los colores de marca (globals.css no está garantizado).
    -->
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
        background: #f4f6fa;
        color: #334155;
        text-align: center;
      }
      .wrap { max-width: 320px; }
      .emoji { font-size: 4rem; margin-bottom: 0.75rem; }
      h1 { font-size: 1.5rem; font-weight: 900; color: #185fa5; margin-bottom: 0.5rem; }
      p { color: #64748b; font-size: 0.95rem; line-height: 1.6; margin-bottom: 1.75rem; }
      .actions { display: flex; flex-direction: column; gap: 0.75rem; }
      a.btn {
        display: block;
        padding: 0.875rem;
        border-radius: 12px;
        font-weight: 700;
        font-size: 0.95rem;
        text-decoration: none;
      }
      a.primary { background: #185fa5; color: #fff; }
      a.outline { background: #fff; color: #185fa5; border: 1.5px solid #b5d4f4; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="emoji">📡</div>
      <h1>Você está sem conexão</h1>
      <p>
        Não conseguimos carregar esta página. Verifique sua internet — as páginas que você já
        visitou continuam disponíveis.
      </p>
      <div class="actions">
        <a class="btn primary" href="/">🔄 Tentar novamente</a>
        <a class="btn outline" href="/listings">🔍 Ver anúncios</a>
      </div>
    </div>
  </body>
</html>
